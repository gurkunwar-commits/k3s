# PostgREST — exposes the `api` schema of the HA Postgres cluster as REST.
# The DB URI (with the authenticator password) is injected from the
# `postgrest-db` Secret created by deploy.sh — never hard-code it here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: apps
  labels: {app: postgrest}
spec:
  replicas: 2
  selector: {matchLabels: {app: postgrest}}
  template:
    metadata: {labels: {app: postgrest}}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgrest
          image: postgrest/postgrest:v12.2.3
          ports: [{containerPort: 3000}]
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            capabilities: {drop: ["ALL"]}
          env:
            - name: PGRST_DB_URI
              valueFrom: {secretKeyRef: {name: postgrest-db, key: uri}}
            - {name: PGRST_DB_SCHEMAS, value: "api"}
            - {name: PGRST_DB_ANON_ROLE, value: "web_anon"}
            - {name: PGRST_SERVER_PORT, value: "3000"}
            - {name: PGRST_DB_POOL, value: "10"}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 300m, memory: 192Mi}
          readinessProbe:
            httpGet: {path: /, port: 3000}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: {name: postgrest, namespace: apps}
spec:
  selector: {app: postgrest}
  ports: [{port: 3000, targetPort: 3000}]
