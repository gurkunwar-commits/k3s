# Ingress — one host, two routers:
#   /      -> web (frontend)
#   /api   -> postgrest (with the /api prefix stripped)
# Traefik prioritises the longer PathPrefix, so /api wins over / automatically.
# __DOMAIN__ is substituted by deploy.sh.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: strip-api, namespace: apps}
spec:
  stripPrefix:
    prefixes: ["/api"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["__DOMAIN__"]
      secretName: web-tls
  rules:
    - host: "__DOMAIN__"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: web, port: {number: 80}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-api
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: apps-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["__DOMAIN__"]
      secretName: web-tls
  rules:
    - host: "__DOMAIN__"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: postgrest, port: {number: 3000}}}
