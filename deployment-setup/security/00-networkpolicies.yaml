# NetworkPolicies — namespace isolation for tenant + data namespaces.
#
# k3s enforces NetworkPolicy through its built-in kube-router. Policies are
# additive: a "default-deny-ingress" policy denies all inbound pod traffic in a
# namespace, and the "allow-*" policies below add back only the required paths.
# Egress is intentionally left open (pods can still reach DNS and the API), so
# these policies isolate *who can reach a namespace* without breaking outbound
# calls. Namespace selectors use the automatic `kubernetes.io/metadata.name`
# label that Kubernetes stamps on every namespace.
#
# Node-sourced traffic (kubelet liveness/readiness probes) is permitted by
# kube-router and is unaffected by these rules.

# ---------------------------------------------------------------------------
# postgres — only same-namespace pods, the CNPG operator, and app workloads
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: postgres
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: postgres
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-and-apps
  namespace: postgres
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        # CNPG operator manages the instances (bootstrap, failover, status).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        # Application workloads connect to Postgres / the pooler.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
---
# ---------------------------------------------------------------------------
# apps — same-namespace pods and the Traefik ingress controller (kube-system)
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: apps
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: apps
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress
  namespace: apps
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
---
