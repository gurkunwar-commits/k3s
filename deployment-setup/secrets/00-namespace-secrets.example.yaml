# Copy to 00-namespace-secrets.yaml, replace placeholders, then apply.
# The real secrets file is gitignored.
#
# AWS IAM: grant least-privilege on the backup bucket/prefix only.
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-app-secret
  namespace: postgres
type: kubernetes.io/basic-auth
stringData:
  username: app
  password: ChangeMe-App-Password-123!
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser-secret
  namespace: postgres
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: ChangeMe-Postgres-Password-123!
---
# CloudNativePG Barman → AWS S3
apiVersion: v1
kind: Secret
metadata:
  name: postgres-s3-credentials
  namespace: postgres
type: Opaque
stringData:
  ACCESS_KEY_ID: AKIAREPLACE_ME
  ACCESS_SECRET_KEY: ChangeMe-Aws-Secret-Access-Key
  AWS_REGION: us-east-1
